#bg.still{animation:none;filter:blur(6px)}
#shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(40,25,60,.35),rgba(10,8,20,.55))}
@keyframes focus{0%,22%{filter:blur(0) brightness(.9);transform:scale(1)}38%{filter:blur(16px) brightness(.8);transform:scale(1.04)}52%,70%{filter:blur(16px) brightness(.8);transform:scale(1.04)}86%,100%{filter:blur(0) brightness(.9);transform:scale(1)}}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);box-shadow:0 10px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.25)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:28px;letter-spacing:.2px;margin-right:auto}
h1 small{font:400 12px 'DM Sans',sans-serif;color:var(--dim);margin-left:8px}
button,select,label.btn{font:500 13px 'DM Sans',sans-serif;color:var(--text);background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
button:hover,label.btn:hover,select:hover{background:rgba(255,255,255,.22)}
button.on{background:rgba(185,166,238,.4);border-color:rgba(220,205,255,.7)}
select option{color:#222}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--glass2);border:1px solid var(--line);border-radius:999px}
.seg button{border:0;background:transparent;padding:5px 12px}
.seg button.on{background:rgba(255,255,255,.28)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);cursor:pointer}
.chk input{accent-color:#b9a6ee}
main{flex:1;min-height:0;display:flex;gap:0}
main.col{flex-direction:column}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#editorPane{flex:0 0 calc(var(--split) - 6px)}
#previewPane{flex:1}
#gutter{width:8px;margin:0 2px;cursor:col-resize;border-radius:8px;flex:none;position:relative}
#gutter::after{content:"";position:absolute;inset:50% 2px auto;height:44px;transform:translateY(-50%);background:var(--line);border-radius:4px}
main.col #gutter{cursor:row-resize;width:auto;height:8px;margin:2px 0}
main.col #gutter::after{inset:2px auto auto 50%;width:44px;height:3px;transform:translateX(-50%)}
.bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .sp{margin-left:auto;font-size:12px;color:var(--dim)}
.edwrap{flex:1;display:flex;min-height:0;font:13px/1.6 'JetBrains Mono',ui-monospace,Menlo,monospace;position:relative}
#lines{padding:12px 8px 12px 12px;text-align:right;color:var(--dim);user-select:none;overflow:hidden;white-space:pre;opacity:.6}
#code{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:12px;font:inherit;white-space:pre;overflow:auto;tab-size:2;caret-color:var(--acc)}
#code::selection{background:rgba(185,166,238,.45)}
.stage{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto;padding:0}
#frameBox{width:100%;height:100%;transition:width .3s ease;max-width:100%}
.stage.dev{padding:12px}
.stage.dev #frameBox{border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 12px 40px rgba(0,0,0,.4)}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
#con{border-top:1px solid var(--line);max-height:34%;display:none;flex-direction:column;min-height:90px}
#con.open{display:flex}
#conOut{flex:1;overflow:auto;padding:8px 12px;font:12px/1.5 'JetBrains Mono',monospace}
#conOut div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.07);white-space:pre-wrap;word-break:break-word}
.warn{color:#ffd98a}.error{color:#ff9aa8}.info{color:#9fd8ff}
footer{display:flex;gap:16px;padding:7px 16px;font-size:12px;color:var(--dim);flex-wrap:wrap}
footer .r{margin-left:auto}
#toast{position:fixed;bottom:56px;left:50%;transform:translate(-50%,20px);opacity:0;padding:9px 18px;border-radius:999px;pointer-events:none;transition:.3s;font-size:13px}
#toast.show{opacity:1;transform:translate(-50%,0)}
.full{position:fixed!important;inset:10px;z-index:20;flex:none!important}

.stg{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;font-size:11px}.stg div{display:flex;justify-content:space-between;gap:8px;color:var(--dim)}.stg em{font-style:normal;color:var(--text)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}.sw.lg{width:20px;height:20px}
#acFoot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid rgba(255,255,255,.14);color:var(--dim);font-size:11px;align-items:center;flex-wrap:wrap}
#acXP{margin-left:auto;display:flex;align-items:center;gap:8px}#acXP .meter{margin:0}
#tip{position:fixed;z-index:70;display:none;max-width:320px;padding:12px 14px;pointer-events:none;font-size:12px;background:rgba(30,24,50,.6);border-radius:18px}
@media(max-width:640px){#acList{width:150px}#ac .body{height:240px}}

.hd{margin:10px 0 3px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
#tip{max-width:360px;max-height:80vh;overflow:hidden}
#tip .nt{margin:4px 0!important;color:var(--dim)!important;font-size:11px}
#tip .wn{margin:8px 0 0!important;padding:6px 10px;border-radius:12px;background:rgba(255,200,120,.16);color:#ffd98a!important;font-size:11px}
#tabs button[data-has]::after{content:"•";margin-left:5px;color:var(--acc)}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>

<header class="glass">
  <h1>Cheeset’s HTML viewer</h1>
  <label class="chk"><input type="checkbox" id="auto" checked> Auto-run</label>
  <button id="run" title="Ctrl/⌘ + Enter">▶ Run</button>
  <div class="menuwrap">
    <button id="more" aria-label="More options">⋯</button>
    <div id="menu" class="glass" hidden>
      <button id="layout">⇆ Switch layout</button>
      <button id="newtab">↗ Open in new tab</button>
      <button id="dl">⇩ Download <em>Ctrl/⌘+S</em></button>
      <label class="btn">⇧ Open file<input type="file" id="file" accept=".html,.htm,.css,.js,.txt" hidden></label>
      <button id="copy">⧉ Copy full page</button>
      <hr>
      <div class="row">Font size <select id="fs"><option value="12">12</option><option value="13" selected>13</option><option value="15">15</option><option value="17">17</option></select></div>
      <div class="row">Preview background <select id="pvbg"><option value="glass">Glass</option><option value="white">White</option><option value="dark">Dark</option></select></div>
      <div class="row">Templates <select id="tpl"><option value="">Choose…</option><option value="blank">Blank page</option><option value="cards">Flexbox cards</option><option value="canvas">Canvas animation</option></select></div>
      <button id="share">🔗 Copy share link</button>
      <button id="motion" class="on">◎ Ambient background</button>
      <button id="clear">Clear this tab</button>
      <button id="reset">↺ Reset to sample</button>
    </div>
  </div>
</header>

<main id="main">
  <section class="pane glass" id="editorPane">
    <div class="bar"><div class="seg" id="tabs"><button data-t="html" class="on">HTML</button><button data-t="css">CSS</button><button data-t="js">JS</button></div><span class="sp" id="saved">Autosaved</span></div>
    <div class="edwrap"><div id="lines">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code editor"></textarea></div>
  </section>
  <div id="gutter" class="glass"></div>
  <section class="pane glass" id="previewPane">
    <div class="bar">
      <div class="seg" id="dev"><button data-w="100%" class="on">Desktop</button><button data-w="768px">Tablet</button><button data-w="390px">Phone</button></div>
      <span class="sp"><button id="con-t">Console <span id="cnt">0</span></button> <button id="full" aria-label="Fullscreen">⛶</button></span>
    </div>
    <div class="stage" id="stage"><div id="frameBox"><iframe id="frame" title="Preview" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-downloads"></iframe></div></div>
    <div id="con"><div class="bar"><strong style="font-weight:500">Console</strong><button id="conClr">Clear</button></div><div id="conOut"></div></div>
  </section>
</main>

<footer><span id="pos">Ln 1, Col 1</span><span id="chars"></span><span id="size"></span><span id="hud"></span><span class="r" id="status">Ready</span></footer>
<div id="ac" class="glass"><div class="body"><div id="acList"></div><div id="acInfo"></div></div><div id="acFoot"><span>↑↓ move</span><span>Tab / Enter accept</span><span>Esc close</span><span>Ctrl+Space open</span><span id="acXP"></span></div></div>
<div id="tip" class="glass"></div>
<div id="toast" class="glass"></div>

<script>
const $=s=>document.querySelector(s);
const SAMPLE={html:`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
  <style>
    body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}
    button{padding:.7em 1.4em;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:inherit;border-radius:999px;font-size:1rem;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Hello, world ✨</h1>
    <p>Edit the code on the left and watch this update live.</p>
    <button id="b">Click me</button>
  </main>
  <script>
    let n=0;
    document.getElementById('b').onclick=e=>{n++;e.target.textContent='Clicked '+n+'×';console.log('clicked',n)};
  <\/script>
</body>
</html>`,css:'',js:''};
const TPL={
blank:`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Untitled</title>
</head>
<body>

</body>
</html>`,
cards:`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:system-ui,sans-serif;margin:0;padding:24px}
    .grid{display:flex;flex-wrap:wrap;gap:16px}
    .card{flex:1 1 200px;padding:20px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(12px)}
  </style>
</head>
<body>
  <div class="grid">
    <div class="card"><h3>One</h3><p>Flexbox card</p></div>
    <div class="card"><h3>Two</h3><p>Flexbox card</p></div>
    <div class="card"><h3>Three</h3><p>Flexbox card</p></div>
  </div>
</body>
</html>`,
canvas:`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block}</style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const c=document.getElementById('c'),x=c.getContext('2d');
    function fit(){c.width=innerWidth;c.height=innerHeight}fit();addEventListener('resize',fit);
    const P=Array.from({length:70},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*3+1,v:Math.random()+.3}));
    (function loop(){
      x.clearRect(0,0,c.width,c.height);
      for(const p of P){p.y-=p.v;if(p.y<-5){p.y=c.height+5;p.x=Math.random()*c.width}
        x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba(255,230,180,.8)';x.fill()}
      requestAnimationFrame(loop)})();
  <\/script>
</body>
</html>`};
const KEY='cheeset-html-viewer-v2';
let S={html:SAMPLE.html,css:SAMPLE.css,js:SAMPLE.js},tab='html',timer,errs=0;
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v.html==='string')S=Object.assign(S,v)}catch(e){}
try{const m=location.hash.match(/^#c=(.+)$/);if(m){const v=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(v&&typeof v.html==='string')S=Object.assign(S,v)}}catch(e){}
let PV='glass';try{PV=localStorage.getItem(KEY+'-pv')||'glass'}catch(e){}
const code=$('#code'),lines=$('#lines'),frame=$('#frame');

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));$('#saved').textContent='Autosaved'}catch(e){$('#saved').textContent='Not saved'}}
function stats(){
  const v=code.value,p=code.selectionStart,b=v.slice(0,p).split('\n');
  $('#pos').textContent='Ln '+b.length+', Col '+(b[b.length-1].length+1);
  $('#chars').textContent=(S.html.length+S.css.length+S.js.length).toLocaleString()+' chars';
}
function gutter(){const n=code.value.split('\n').length;let s='';for(let i=1;i<=n;i++)s+=i+'\n';lines.textContent=s;lines.scrollTop=code.scrollTop}
function loadTab(){code.value=S[tab];gutter();stats();if(typeof markTabs==='function')markTabs()}

const CONSOLE_JS=`<script>(function(){function s(t,a){try{parent.postMessage({__cv:1,t:t,a:a.map(function(x){try{return typeof x==='object'?JSON.stringify(x,null,1):String(x)}catch(e){return String(x)}})},'*')}catch(e){}}['log','info','warn','error'].forEach(function(k){var o=console[k];console[k]=function(){s(k,[].slice.call(arguments));o.apply(console,arguments)}});addEventListener('error',function(e){s('error',[e.message+' (line '+e.lineno+')'])});addEventListener('unhandledrejection',function(e){s('error',['Unhandled promise: '+e.reason])});})();<\/script>`;
const BASE='<style>html{color:#f4f0f7}</style>';
function build(exp){
  let h=S.html;
  const style=S.css.trim()?'<style>\n'+S.css+'\n</style>':'',script=S.js.trim()?'<script>\n'+S.js+'\n<\/script>':'';
  const ins=(re,s,after)=>{const m=re.exec(h);if(!m)return false;const i=after?m.index+m[0].length:m.index;h=h.slice(0,i)+s+h.slice(i);return true};
  const insLast=(tag,s)=>{const i=h.toLowerCase().lastIndexOf(tag);if(i<0)return false;h=h.slice(0,i)+s+h.slice(i);return true};
  if(style&&!ins(/<\/head>/i,style+'\n')&&!ins(/<body[\s>]/i,style+'\n')&&!ins(/<html[^>]*>/i,style,true)&&!ins(/<!doctype[^>]*>/i,style,true))h=style+h;
  if(script&&!insLast('</body>',script+'\n')&&!insLast('</html>',script+'\n'))h+='\n'+script;
  if(!exp){const help=CONSOLE_JS+(PV==='white'?'':BASE);if(!ins(/<head(?=[\s>])[^>]*>/i,help,true)&&!ins(/<html(?=[\s>])[^>]*>/i,help,true)&&!ins(/<!doctype[^>]*>/i,help,true))h=help+h}
  return h;
}
let conAuto=false;
function diagnose(){try{
  const o=$('#conOut'),add=(c,m)=>{const e=document.createElement('div');e.className=c;e.textContent=m;o.appendChild(e);$('#cnt').textContent=++errs};
  const css=S.css.replace(/\/\*[\s\S]*?\*\//g,''),bad=[];let tot=0;
  if(css.trim()){for(const m of css.matchAll(/([^{}]+)\{/g)){const s=m[1].trim();if(!s||s[0]==='@')continue;for(const p of s.split(',')){const q=p.trim();if(!q||/^(from|to|[\d.]+%)$/.test(q))continue;tot++;if(cnt(q)===0)bad.push(q)}}
    bad.slice(0,6).forEach(q=>add('warn','CSS tab: "'+q+'" matches nothing in your HTML tab — add an element with that class, id or tag.'));
    if(tot&&!bad.length)add('info','CSS tab: all '+tot+' selector(s) match elements.')}
  for(const m of S.js.matchAll(/getElementById\(\s*['"]([^'"]+)['"]/g))if(!domOf().getElementById(m[1]))add('warn','JS tab: no element with id "'+m[1]+'" in your HTML tab.');
  if(bad.length){toast('⚠ '+bad.length+' CSS selector(s) match nothing — see Console');if(!conAuto){conAuto=true;$('#con').classList.add('open');$('#con-t').classList.add('on')}}
}catch(e){}}
function markTabs(){document.querySelectorAll('#tabs button').forEach(b=>b.toggleAttribute('data-has',b.dataset.t!=='html'&&!!(S[b.dataset.t]||'').trim()))}
code.addEventListener('input',markTabs);
function run(){
  errs=0;$('#conOut').innerHTML='';$('#cnt').textContent='0';
  frame.srcdoc=build();diagnose();$('#status').textContent='Updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
addEventListener('message',e=>{
  const d=e.data;if(!d||!d.__cv||e.source!==frame.contentWindow)return;
  const o=$('#conOut'),el=document.createElement('div');el.className=d.t;el.textContent=d.a.join(' ');o.appendChild(el);o.scrollTop=o.scrollHeight;
  $('#cnt').textContent=++errs;
});
function schedule(){$('#saved').textContent='Saving…';clearTimeout(timer);timer=setTimeout(()=>{save();if($('#auto').checked)run()},350)}

code.addEventListener('input',()=>{S[tab]=code.value;gutter();stats();schedule()});
code.addEventListener('scroll',()=>lines.scrollTop=code.scrollTop);
['keyup','click'].forEach(ev=>code.addEventListener(ev,stats));
code.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();const a=code.selectionStart,b=code.selectionEnd;code.setRangeText('  ',a,b,'end');code.dispatchEvent(new Event('input'))}
  if(e.key==='Enter'&&!(e.ctrlKey||e.metaKey)){ // keep indentation
    const v=code.value,a=code.selectionStart,ls=v.lastIndexOf('\n',a-1)+1,ind=(v.slice(ls,a).match(/^\s*/)||[''])[0];
    if(ind){e.preventDefault();code.setRangeText('\n'+ind,a,code.selectionEnd,'end');code.dispatchEvent(new Event('input'))}
  }
});
addEventListener('keydown',e=>{
  const m=e.ctrlKey||e.metaKey;
  if(m&&e.key==='Enter'){e.preventDefault();run()}
  if(m&&e.key.toLowerCase()==='s'){e.preventDefault();download()}
  if(e.key==='Escape'){document.querySelectorAll('.full').forEach(x=>x.classList.remove('full'))}
});

$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));loadTab();code.focus()});
$('#run').onclick=run;
$('#fs').onchange=e=>{const s=e.target.value+'px';code.style.fontSize=lines.style.fontSize=s;gutter()};
$('#clear').onclick=()=>{if(S[tab]&&!confirm('Clear the '+tab.toUpperCase()+' tab?'))return;S[tab]='';loadTab();schedule()};
$('#reset').onclick=()=>{if(!confirm('Reset everything to the sample?'))return;S=Object.assign({},SAMPLE);loadTab();save();run()};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(build(true));toast('Full page copied')}catch(e){toast('Copy blocked by browser')}};
function download(){const b=new Blob([build(true)],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='page.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Downloaded page.html')}
$('#dl').onclick=download;
$('#newtab').onclick=()=>{const u=URL.createObjectURL(new Blob([build(true)],{type:'text/html'}));window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
  const t=/\.css$/i.test(f.name)?'css':/\.js$/i.test(f.name)?'js':'html';S[t]=r.result;
  document.querySelector('#tabs [data-t="'+t+'"]').click();schedule();toast('Loaded '+f.name)};r.readAsText(f);e.target.value=''};
// drag & drop file onto editor
['dragover','drop'].forEach(ev=>code.addEventListener(ev,e=>{e.preventDefault();if(ev==='drop'&&e.dataTransfer.files[0]){$('#file').files=e.dataTransfer.files;$('#file').dispatchEvent(new Event('change'))}}));

$('#dev').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#dev button').forEach(x=>x.classList.toggle('on',x===b));
  $('#frameBox').style.width=b.dataset.w;$('#stage').classList.toggle('dev',b.dataset.w!=='100%');sz()});
function sz(){$('#size').textContent='Preview '+Math.round($('#frameBox').getBoundingClientRect().width)+' px'}
new ResizeObserver(sz).observe($('#frameBox'));
$('#con-t').onclick=e=>{$('#con').classList.toggle('open');e.currentTarget.classList.toggle('on')};
$('#conClr').onclick=()=>{$('#conOut').innerHTML='';$('#cnt').textContent='0';errs=0};
$('#full').onclick=()=>$('#previewPane').classList.toggle('full');
$('#motion').onclick=e=>{e.currentTarget.classList.toggle('on');$('#bg').classList.toggle('still',!e.currentTarget.classList.contains('on'))};

// layout + draggable divider
const main=$('#main');
function stack(on){document.documentElement.classList.toggle('stack',on);main.classList.toggle('col',on);$('#editorPane').style.flex='';main.style.setProperty('--split','50%')}
$('#layout').onclick=()=>stack(!main.classList.contains('col'));
if(innerWidth<700)stack(true);
(function(){const g=$('#gutter');let d=false;
  g.addEventListener('pointerdown',e=>{d=true;g.setPointerCapture(e.pointerId);document.body.style.userSelect='none';frame.style.pointerEvents='none'});
  g.addEventListener('pointermove',e=>{if(!d)return;const r=main.getBoundingClientRect(),c=main.classList.contains('col');
    let p=c?(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width;p=Math.min(.8,Math.max(.2,p));
    main.style.setProperty('--split',p*100+'%');
    $('#editorPane').style.flex='0 0 calc('+p*100+'% - 6px)'});
  const up=()=>{d=false;document.body.style.userSelect='';frame.style.pointerEvents=''};
  g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up)})();


const menu=$('#menu');
$('#more').onclick=e=>{e.stopPropagation();menu.hidden=!menu.hidden};
document.addEventListener('click',e=>{if(!menu.contains(e.target))menu.hidden=true});
menu.addEventListener('click',e=>{if(e.target.closest('button')&&!e.target.closest('select'))setTimeout(()=>menu.hidden=true,0)});

function applyPV(){$('#frameBox').dataset.bg=PV;$('#pvbg').value=PV}
$('#pvbg').onchange=e=>{PV=e.target.value;try{localStorage.setItem(KEY+'-pv',PV)}catch(x){}applyPV();run()};
applyPV();
$('#tpl').onchange=e=>{const t=TPL[e.target.value];e.target.value='';if(!t)return;if(!confirm('Replace all three tabs with this template?'))return;S={html:t,css:'',js:''};loadTab();save();run();menu.hidden=true};
$('#share').onclick=async()=>{
  const d=btoa(unescape(encodeURIComponent(JSON.stringify(S)))),base=location.href.split('#')[0],u=base+'#c='+d;
  try{history.replaceState(null,'','#c='+d)}catch(x){}
  try{await navigator.clipboard.writeText(u);toast(u.length>8000?'Link copied (long, may not work everywhere)':'Share link copied')}catch(x){toast('Link is in the address bar')}};
function fire(){code.dispatchEvent(new Event('input'))}
const PAIRS={'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`'},CLOSERS=')]}"\'`';
code.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1)return;
  const v=code.value,a=code.selectionStart,b=code.selectionEnd;
  if(a===b&&CLOSERS.includes(e.key)&&v[a]===e.key){e.preventDefault();code.setSelectionRange(a+1,a+1);return}
  const cl=PAIRS[e.key];if(!cl)return;
  if(a!==b){e.preventDefault();code.setRangeText(e.key+v.slice(a,b)+cl,a,b,'select');fire();return}
  if(/\w/.test(v[a]||'')||('"\'`'.includes(e.key)&&/\w/.test(v[a-1]||'')))return;
  e.preventDefault();code.setRangeText(e.key+cl,a,a,'end');code.setSelectionRange(a+1,a+1);fire()});
function toggleComment(){
  const v=code.value,a=code.selectionStart,b=code.selectionEnd,ls=v.lastIndexOf('\n',a-1)+1;let le=v.indexOf('\n',b);if(le<0)le=v.length;
  const [o,c]=tab==='js'?['// ','']:tab==='css'?['/* ',' */']:['<!-- ',' -->'],seg=v.slice(ls,le).split('\n');
  const all=seg.every(l=>!l.trim()||l.trimStart().startsWith(o.trim()));
  const out=seg.map(l=>{if(!l.trim())return l;const i=l.match(/^\s*/)[0];let t=l.slice(i.length);
    if(all){t=t.startsWith(o)?t.slice(o.length):t.slice(o.trim().length);if(c)t=t.endsWith(c)?t.slice(0,-c.length):t.endsWith(c.trim())?t.slice(0,-c.trim().length):t;return i+t}
    return i+o+t+c}).join('\n');
  code.setRangeText(out,ls,le,'select');fire()}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='/'&&document.activeElement===code){e.preventDefault();toggleComment()}});
/*AC-START*/
const PP=s=>s.trim().split('\n').map(l=>{const[a,b='',c='']=l.split('|');return{n:a.trim(),d:b.trim(),x:c.split(' ').filter(Boolean)}});
const VOID=new Set('img input br hr meta link area base col embed source track wbr'.split(' '));
const BOOLA=new Set('disabled checked required hidden multiple selected open controls autoplay loop muted defer async reversed'.split(' '));
const TAGS=PP(`html|Root element of the page|lang
head|Metadata container (title, links, styles)
title|Text shown in the browser tab
meta|Page metadata such as charset or viewport|charset name content
link|Links an external resource (CSS, icons)|rel href type
style|Embedded CSS rules
script|Embedded or external JavaScript|src type defer async
body|All visible page content
header|Introductory or navigation area
nav|Block of navigation links
main|Main content of the page
section|Thematic grouping of content
article|Self-contained piece of content
aside|Side content related to the main flow
footer|Footer for a page or section
h1|Top-level heading
h2|Second-level heading
h3|Third-level heading
p|Paragraph of text
div|Generic block container
span|Generic inline container
a|Hyperlink|href target rel download
img|Embeds an image|src alt width height loading
button|Clickable button|type disabled
input|Form field|type value placeholder name required disabled checked min max step
textarea|Multi-line text field|rows cols placeholder name
select|Dropdown menu|name multiple
option|Choice inside a select|value selected
label|Caption for a form control|for
form|Form container|action method
ul|Unordered (bulleted) list
ol|Ordered (numbered) list|start reversed
li|List item
table|Table of data
tr|Table row
td|Table data cell|colspan rowspan
th|Table header cell|colspan scope
video|Video player|src controls autoplay loop muted poster
audio|Audio player|src controls autoplay loop
canvas|Scriptable bitmap drawing surface|width height
svg|Vector graphics container|viewBox width height
iframe|Embeds another page|src title allow
